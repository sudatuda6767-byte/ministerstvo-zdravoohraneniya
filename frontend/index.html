<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медицинская регистратура</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen" class="screen active">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">🏥</div>
            <h1>Медицинская регистратура</h1>
            <p class="subtitle">Запись на приём к врачу</p>
        </div>

        <div id="login-form" class="auth-form">
            <h2>Вход в систему</h2>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="login-username" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль">
            </div>
            <button class="btn btn-primary btn-full" onclick="doLogin()">Войти</button>
            <p class="auth-switch">Нет аккаунта? <a href="#" onclick="showRegister()">Регистрация</a></p>

            <div class="test-accounts">
                <p><strong>Тестовые аккаунты:</strong></p>
                <div class="test-acc" onclick="fillLogin('shvets','Admin2024!')">👑 shvets / Admin2024!</div>
                <div class="test-acc" onclick="fillLogin('registratura','Reg2024!')">📋 registratura / Reg2024!</div>
                <div class="test-acc" onclick="fillLogin('petrov','User2024!')">👤 petrov / User2024!</div>
            </div>
        </div>

        <div id="register-form" class="auth-form" style="display:none">
            <h2>Регистрация</h2>
            <div class="form-group"><label>ФИО *</label><input type="text" id="reg-fullname"></div>
            <div class="form-group"><label>Логин *</label><input type="text" id="reg-username"></div>
            <div class="form-group"><label>Пароль *</label><input type="password" id="reg-password"></div>
            <div class="form-group"><label>Телефон</label><input type="text" id="reg-phone"></div>
            <button class="btn btn-primary btn-full" onclick="doRegister()">Зарегистрироваться</button>
            <p class="auth-switch">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p>
        </div>
    </div>
</div>

<div id="main-screen" class="screen">
    <header class="header">
        <div class="header-left"><span class="logo-small">🏥</span><span class="header-title">Медрегистратура</span></div>
        <div class="header-right">
            <span id="user-info" class="user-info"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">Выйти</button>
        </div>
    </header>
    <nav class="nav-tabs" id="nav-tabs"></nav>
    <main class="content" id="content"></main>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal-content"></div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
