<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медицинская регистратура</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============ ЭКРАН АВТОРИЗАЦИИ ============ -->
<div id="auth-screen" class="screen active">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">🏥</div>
            <h1>Медицинская регистратура</h1>
            <p class="subtitle">Запись на приём к врачу</p>
        </div>

        <!-- Вход -->
        <div id="login-form" class="auth-form">
            <h2>Вход в систему</h2>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="login-username" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль">
            </div>
            <button class="btn btn-primary btn-full" onclick="doLogin()">Войти</button>
            <p class="auth-switch">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p>

            <div class="test-accounts">
                <p><strong>Тестовые аккаунты:</strong></p>
                <div class="test-acc" onclick="fillLogin('shvets','Admin2024!')">
                    👑 Админ: shvets / Admin2024!
                </div>
                <div class="test-acc" onclick="fillLogin('registratura','Reg2024!')">
                    📋 Регистратура: registratura / Reg2024!
                </div>
                <div class="test-acc" onclick="fillLogin('petrov','User2024!')">
                    👤 Пациент: petrov / User2024!
                </div>
            </div>
        </div>

        <!-- Регистрация -->
        <div id="register-form" class="auth-form" style="display:none">
            <h2>Регистрация</h2>
            <div class="form-group">
                <label>ФИО *</label>
                <input type="text" id="reg-fullname" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>Логин *</label>
                <input type="text" id="reg-username" placeholder="Придумайте логин">
            </div>
            <div class="form-group">
                <label>Пароль *</label>
                <input type="password" id="reg-password" placeholder="Минимум 6 символов">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" id="reg-phone" placeholder="+7-___-___-__-__">
            </div>
            <button class="btn btn-primary btn-full" onclick="doRegister()">Зарегистрироваться</button>
            <p class="auth-switch">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p>
        </div>
    </div>
</div>

<!-- ============ ГЛАВНЫЙ ЭКРАН ============ -->
<div id="main-screen" class="screen">

    <!-- Шапка -->
    <header class="header">
        <div class="header-left">
            <span class="logo-small">🏥</span>
            <span class="header-title">Медрегистратура</span>
        </div>
        <div class="header-right">
            <span id="user-info" class="user-info"></span>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">Выйти</button>
        </div>
    </header>

    <!-- Навигация -->
    <nav class="nav-tabs" id="nav-tabs">
        <!-- Заполняется через JS в зависимости от роли -->
    </nav>

    <!-- Контент -->
    <main class="content" id="content">
        <!-- Заполняется через JS -->
    </main>
</div>

<!-- Модальное окно -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal-content">
        <!-- Заполняется через JS -->
    </div>
</div>

<!-- Уведомления -->
<div id="toast-container" class="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
